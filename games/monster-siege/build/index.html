<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Siege</title>
<link rel="icon" href="data:,">
<script src="/chomp-sdk.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #12132b; color: #eee; font: 15px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #menu { position: fixed; inset: 0; overflow: auto; padding: 12px; box-sizing: border-box; background: #17131fee; }
  #menu[hidden] { display: none; }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { margin: 4px 0; font-size: 26px; } p { margin: 4px 0 10px; color: #aaa; }
  .pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .mon { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; border: 2px solid #333; background: #221d2c; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .mon.deck { border-color: #c86bff; }
  .mon i { font-style: normal; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; flex: none; }
  .mon small { display: block; color: #aaa; font-size: 11px; }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: #333; }
  .deck .tag { background: #c86bff; color: #000; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
  button.b { padding: 10px 14px; border-radius: 8px; border: 0; background: #4fb3ff; color: #000; font: 700 15px system-ui; cursor: pointer; }
  button.b.alt { background: #2f2a3a; color: #eee; } button.b:disabled { opacity: .4; cursor: default; }
  input { padding: 9px; width: 70px; border-radius: 8px; border: 1px solid #444; background: #111; color: #eee; font: 700 15px monospace; text-transform: uppercase; }
  #msg { color: #ffcf4a; min-height: 20px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="menu"><div class="wrap">
  <h1>Monster Siege</h1>
  <p>Tap a monster to toggle <b style="color:#c86bff">deck</b> / bench: up to 8 cards, empty slots become Grunts. In battle, drag a card onto the <b style="color:#ffb02e">path ⚔</b> to send its squad from your core, or onto free ground in <b style="color:#4fb3ff">your zone 🛡</b> to station it as a defender. Best in landscape.</p>
  <div class="pool" id="pool"></div>
  <p id="count"></p>
  <div class="row">
    <button class="b" data-bot="easy">vs Bot (easy)</button>
    <button class="b" data-bot="hard">vs Bot (hard)</button>
  </div>
  <div class="row">
    <button class="b alt" id="host">Host live 1v1</button>
    <input id="code" maxlength="4" placeholder="CODE"><button class="b alt" id="join">Join</button>
  </div>
  <div id="msg"></div>
</div></div>
<script type="module">
import { newMatch, step, demoMonster, demoLoadout, archetypeOf, scoreOf, GLYPH, COST, HZ } from './sim.js?v=2';
import { render, layout, dropAt, loadArt } from './render.js?v=4';
import { makeBot } from './bot.js?v=2';
import { connectLive } from './net.js?v=2';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), $ = (id) => document.getElementById(id);
const menu = $('menu'), msg = (t) => ($('msg').textContent = t);
const qs = new URLSearchParams(location.search);

// ---- session: portal sends it after ready(); standalone falls back after 300 ms ----
const hash = (str) => { let h = 2166136261; for (const c of String(str)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
let session = null;
const useSession = (s) => { if (!session) session = { mode: 'free', ...s, seedU: /^\d+$/.test(String(s.seed)) ? Number(s.seed) >>> 0 : hash(s.seed) }; };
window.Chomp?.onSession(useSession);
const chomp = (f, ...a) => { try { window.Chomp?.[f](...a); } catch (e) { console.warn(e); } };

// ---- loadout ----
// TODO(solana): NFT read the player's Core monster assets (DNA + equipped skills) for the loadout; demo monsters until then.
const POOL = Array.from({ length: 12 }, (_, i) => demoMonster(1 + i));
let roles = POOL.map((_, i) => (i < 8 ? 'deck' : 'bench'));
try { const r = JSON.parse(localStorage.getItem('ms.deck')); if (Array.isArray(r) && r.length === POOL.length) roles = r; } catch { /* sandboxed: no storage */ }
const loadout = () => {
  const deck = POOL.filter((_, i) => roles[i] === 'deck');
  return { deck: deck.concat(Array(8 - deck.length).fill(null)) };
};
function drawPool() {
  const n = (r) => roles.filter((x) => x === r).length;
  $('pool').innerHTML = '';
  POOL.forEach((m, i) => {
    const a = archetypeOf(m.dna), b = document.createElement('button');
    b.className = 'mon ' + roles[i];
    b.innerHTML = `<i style="background:hsl(${m.dna.hue},65%,55%);border:2px solid hsl(${m.dna.accent},70%,40%)">${GLYPH[a]}</i><span><b></b> <span class="tag">${roles[i]}</span><small>${a} · ${COST[a]}⚡ · S${m.dna.str} D${m.dna.dex} F${m.dna.def} V${m.dna.spd}</small><small>${m.skills.map((s) => s.kind + (s.mag > 1 ? '×' + s.mag : '')).join(', ')}</small></span>`;
    b.querySelector('b').textContent = m.name;
    b.onclick = () => {
      roles[i] = roles[i] === 'deck' || n('deck') >= 8 ? 'bench' : 'deck';
      try { localStorage.setItem('ms.deck', JSON.stringify(roles)); } catch { /* ok */ }
      drawPool();
    };
    $('pool').append(b);
  });
  $('count').textContent = `Deck ${n('deck')}/8 (+${8 - n('deck')} Grunts)`;
}

// ---- match ----
let g = null; // {s, seat, bot, live, pending, countdown, ended, names}
const hist = {}; // live: state signature every 30 ticks, for the two-tab desync check
window.siege = { hist, get g() { return g; } };
const ui = { seat: 0, sel: null, drag: null, ms: 0, banner: '', names: ['You', 'Bot'] };

function begin(seed, loadouts, seat, extra) {
  g = { s: newMatch(seed, loadouts), seat, pending: [], countdown: 3 * HZ, ended: false, acc: 0, ...extra };
  ui.seat = seat; ui.sel = null; ui.drag = null;
  menu.hidden = true;
}
function startBot(level) {
  if (!session) return msg('Connecting…');
  const seed = session.seedU;
  begin(seed, [loadout(), demoLoadout(500 + (seed % 1000))], 0, { bot: makeBot(1, level, seed), self: qs.has('selftest') ? makeBot(0, 'hard', seed + 1) : null });
  ui.names = ['You', `Bot (${level[0].toUpperCase() + level.slice(1)})`]; ui.ai = true;
}
function startLive(code) {
  msg(code ? 'Joining…' : 'Connecting…');
  const live = connectLive({
    code, name: 'Player', loadout: loadout(),
    on: {
      room: (m) => msg(`Room ${m.code} — waiting for opponent… (share the code)`),
      start: (m) => { begin(m.seed >>> 0, m.loadouts, live.seat, { live, countdown: 0 }); chomp('start'); ui.names = live.seat ? ['Host', 'You'] : ['You', 'Guest']; ui.ai = false; },
      error: (e) => msg(e),
      peer: (m) => { if (!g && m.conn?.every(Boolean)) msg('Opponent joined. Starting…'); if (g?.live === live && !g.ended) ui.peer = m.closed ? 'connection lost' : m.conn?.every(Boolean) ? '' : 'opponent disconnected…'; },
      forfeit: (m) => g?.live === live && finish({ winner: m.winner, reason: 'forfeit' }),
    },
  });
}
function finish(over) {
  if (g.ended) return;
  g.ended = true;
  const me = g.seat, won = over.winner === me, draw = over.winner == null;
  ui.banner = draw ? 'Draw' : won ? 'Victory!' : 'Defeat';
  // TODO(solana): VRF 10% skill-token drop roll for the winner.
  console.log('match over', over.winner, over.reason, g.s.t);
  chomp('result', { winner: draw ? 'draw' : won ? 'you' : 'opponent', score: scoreOf(g.s, me), reason: over.reason });
  if (g.live) { g.live.over(); g.live.close(); }
  setTimeout(() => { menu.hidden = false; ui.banner = ''; g = null; msg(`Last match: ${draw ? 'draw' : won ? 'win' : 'loss'} (${over.reason})`); }, 3000);
}

function tick() {
  const s = g.s;
  if (g.live) {
    let n = 0;
    while (g.s.t < g.live.beat && !g.s.over && n++ < 60) {
      g.s = step(g.s, g.live.inputsAt(g.s.t)); // catch up after a stall
      if (g.s.t % 30 === 0) hist[g.s.t] = JSON.stringify([g.s.P.map((p) => [p.core, p.e, p.hand]), g.s.units.map((u) => [u.x, u.y, u.hp])]);
    }
    return;
  }
  if (g.countdown > 0) { if (--g.countdown === 0) chomp('start'); return; }
  const ins = g.pending.splice(0);
  const b = g.bot(s); if (b) ins.push(b);
  const a = g.self?.(s); if (a) ins.push(a);
  g.s = step(s, ins);
}
let last = 0;
function frame(now) {
  const dt = Math.min(250, now - (last || now)); last = now; ui.ms = now;
  const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  if (g) {
    if (!g.ended) {
      if (g.live) tick();
      else for (g.acc += g.self ? 400 : dt; g.acc >= 1000 / HZ && !g.s.over; g.acc -= 1000 / HZ) tick();
      if (g.s.over) finish(g.s.over);
    }
    if (!g.ended) ui.banner = g.countdown > 0 ? String(Math.ceil(g.countdown / HZ)) : g.live && g.s.t >= g.live.beat && ui.peer ? ui.peer : '';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save(); ctx.scale(dpr, dpr); render(ctx, w, h, g.s, ui); ctx.restore();
  } else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); }
  requestAnimationFrame(frame);
}

// ---- input: drag a card onto a hex (path = attack, own ground = defend), or tap card then tap hex ----
const hit = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function cardAt(x, y) { const L = layout(innerWidth, innerHeight); return L.cards.findIndex((r) => hit(r, x, y)); }
function play(px, py) {
  const me = g.s.P[g.seat], ci = me.hand[ui.sel], { h, kind } = dropAt(layout(innerWidth, innerHeight), g.s, ui, px, py);
  if (!kind || me.cards[ci].cost * 60 > me.e) return false; // invalid: card stays in hand
  if (g.live) g.live.play(ci, ...h); else g.pending.push({ seat: g.seat, card: ci, x2: h[0], y: h[1] });
  ui.sel = null;
  return true;
}
cv.addEventListener('pointerdown', (e) => {
  if (!g || g.ended) return;
  const i = cardAt(e.clientX, e.clientY);
  if (i >= 0) { ui.sel = ui.sel === i ? null : i; ui.drag = ui.sel != null ? { x: e.clientX, y: e.clientY, moved: false } : null; return; }
  if (ui.sel != null) play(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', (e) => { if (ui.drag) { ui.drag.x = e.clientX; ui.drag.y = e.clientY; ui.drag.moved = true; } });
cv.addEventListener('pointerup', (e) => {
  if (ui.drag?.moved && cardAt(e.clientX, e.clientY) < 0 && ui.sel != null) play(e.clientX, e.clientY);
  ui.drag = null;
});
addEventListener('keydown', (e) => { if (e.key === 'r') ui.showRange = !ui.showRange; });

// ---- boot ----
document.querySelectorAll('[data-bot]').forEach((b) => (b.onclick = () => startBot(b.dataset.bot)));
$('host').onclick = () => startLive(null);
$('join').onclick = () => { const c = $('code').value.trim().toUpperCase(); if (/^[A-Z]{4}$/.test(c)) startLive(c); else msg('Enter a 4-letter code'); };
if (qs.get('room')) $('code').value = qs.get('room');
drawPool();
loadArt();
requestAnimationFrame(frame);
chomp('ready');
setTimeout(() => useSession({ mode: 'free', seed: qs.get('seed') ?? String((Math.random() * 2 ** 32) >>> 0) }), 300);
if (qs.has('selftest')) setTimeout(() => startBot('easy'), 350); // headless check: bot vs bot, 12x speed
</script>
</body>
</html>
