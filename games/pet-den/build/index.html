<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Den</title>
<link rel="icon" href="data:,">
<script src="/chomp-sdk.js"></script>
<style>
  :root { --glass: rgba(24, 14, 44, .74); --line: rgba(196, 140, 255, .28); --vio: #b36bff; --vio2: #7b3cff; --gold: #ffcc4d; --txt: #f1e9ff; --dim: #b7a6d6; --ok: #3ee07f; --mid: #ffcf4a; --bad: #ff5d6c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #120a22; color: var(--txt); font: 14px "Nunito", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .4; cursor: default; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(8px); box-shadow: 0 0 22px rgba(123, 60, 255, .22), inset 0 1px 0 rgba(255, 255, 255, .06); }
  .dot { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: #ff3d5a; border: 2px solid #2a1146; display: none; }
  .dot.on { display: block; }
  h3 { margin: 0 0 8px; font-size: 17px; font-weight: 800; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(60, 30, 100, .6); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .pill.rar { background: rgba(140, 70, 255, .35); color: #e3cbff; }
  .pill.Rare { background: #6b3bd6aa; } .pill.Epic { background: #c23bd6aa; } .pill.Legendary { background: #d6a23baa; color: #fff3c4; }

  /* ---- nav ---- */
  .nav { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 14px; background: linear-gradient(#1a0d33f2, #160b2bdd); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
  .logo { font-weight: 900; font-size: 22px; color: #d9a8ff; display: flex; align-items: center; gap: 6px; text-shadow: 0 0 12px #a855f7; margin-right: 14px; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .tab { padding: 8px 16px; border-radius: 99px; font-weight: 700; color: #ddd0f5; white-space: nowrap; }
  .tab.on { background: linear-gradient(#6a2fd0, #4a1c9c); box-shadow: 0 0 16px #8b4dff, inset 0 0 0 1px #b98bff; color: #fff; }
  .wallet { display: flex; align-items: center; gap: 8px; }
  .cur { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; background: #241540; border: 1px solid var(--line); font-weight: 800; font-variant-numeric: tabular-nums; }
  .cur button { font-weight: 900; font-size: 18px; line-height: 1; padding: 0 0 0 4px; }
  .icon-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
  #avatar { background: linear-gradient(135deg, #3d8c5a, #6a2fd0); border: 2px solid #b98bff; font-weight: 900; font-size: 13px; }
  #logbox { position: absolute; right: 50px; top: 52px; width: 280px; max-height: 260px; overflow: auto; padding: 10px; font-size: 12px; display: none; z-index: 20; }
  #logbox.on { display: block; }
  #logbox div { padding: 4px 0; border-bottom: 1px solid #ffffff12; }

  /* ---- den grid ---- */
  main { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 74px 280px 1fr 318px; grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "rail left stage right" "count menu menu evolve"; gap: 10px 14px; padding: 12px 14px; }
  .scene { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
  .scene svg { width: 100%; height: 100%; display: block; transition: filter .6s; }
  .scene.h1 svg { filter: hue-rotate(-70deg) saturate(1.1); }
  .scene.h2 svg { filter: hue-rotate(75deg) saturate(1.15); }
  /* Swap point: drop build/art/habitat-bg.webp in, then uncomment the background line below (it covers the placeholder SVG scene). */
  .scene .bg { position: absolute; inset: 0; /* background: url(art/habitat-bg.webp?v=1) center / cover no-repeat; */ }
  main > :not(.scene) { position: relative; z-index: 1; }

  .rail { grid-area: rail; display: flex; flex-direction: column; gap: 10px; align-items: center; overflow-y: auto; scrollbar-width: none; padding: 4px 0; }
  .slot { position: relative; flex: none; width: 66px; height: 66px; border-radius: 14px; background: rgba(30, 18, 52, .8); border: 2px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .slot img { width: 58px; height: 58px; object-fit: contain; }
  .slot.on { border-color: #d39bff; box-shadow: 0 0 16px #a855f7, inset 0 0 12px #a855f766; }
  .slot.dead img { opacity: .25; filter: grayscale(1) !important; }
  .slot i { position: absolute; top: 5px; right: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px currentColor; }
  .slot i.bad { background: var(--bad); } .slot i.busy { background: #4fb3ff; }
  .slot.add { font-size: 30px; color: var(--dim); }
  .egg { width: 34px; height: 44px; border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; background: radial-gradient(circle at 35% 30%, #ffe1b0, #d0703a 55%, #6b2a50); box-shadow: 0 0 14px #ff9a5a88; animation: wob 2.4s ease-in-out infinite; }
  @keyframes wob { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  .count { grid-area: count; align-self: end; justify-self: start; white-space: nowrap; padding: 8px 12px; border-radius: 12px; font-weight: 800; margin-left: -4px; }

  .left { grid-area: left; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .name { display: flex; align-items: center; gap: 8px; font-size: 30px; font-weight: 900; text-shadow: 0 2px 8px #000a; line-height: 1.1; }
  .name input { font: inherit; width: 190px; background: #1c1036; color: inherit; border: 1px solid var(--vio); border-radius: 8px; padding: 0 6px; }
  .pencil { font-size: 16px; width: 30px; height: 30px; border-radius: 50%; background: #2a1748cc; border: 1px solid var(--line); }
  .lv { display: grid; grid-template-columns: 38px 1fr auto; grid-template-rows: auto 8px; gap: 3px 8px; align-items: center; }
  .crown { grid-row: span 2; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(#5a3a10, #2a1a08); border: 2px solid var(--gold); display: grid; place-items: center; font-size: 18px; }
  .lv b { font-size: 16px; } .lv small { color: var(--dim); font-size: 12px; }
  .lv .xp { grid-column: 2 / 4; height: 8px; border-radius: 6px; background: #2a1c40; overflow: hidden; }
  .lv .xp i { display: block; height: 100%; background: linear-gradient(90deg, #ffb52a, #ffe07a); box-shadow: 0 0 8px #ffcc4d; }
  .stats { padding: 12px 16px; display: flex; flex-direction: column; min-height: 0; overflow: auto; scrollbar-width: thin; }
  .row { display: grid; grid-template-columns: 22px 88px 1fr 54px; gap: 8px; align-items: center; height: 27px; font-size: 13.5px; }
  .row .ic { font-size: 16px; text-align: center; }
  .bar { height: 9px; border-radius: 6px; background: #2a1c40; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width .3s; border-radius: 6px; }
  .bar i.mid { background: linear-gradient(90deg, #eab308, #fde047); } .bar i.low { background: linear-gradient(90deg, #dc2626, #f87171); }
  .num { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .grow { grid-template-columns: 22px 1fr auto; border-bottom: 1px solid #ffffff10; }
  .grow b { font-variant-numeric: tabular-nums; }
  .stats hr { border: 0; border-top: 1px solid #ffffff1a; margin: 8px 0; width: 100%; }

  .stage { grid-area: stage; display: flex; flex-direction: column; align-items: center; min-height: 0; min-width: 0; }
  .track { display: flex; align-items: flex-start; gap: 4px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 58px; font-size: 13px; color: #c9b8e8; font-weight: 700; }
  .step span { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #24163ecc; border: 1px solid var(--line); font-size: 18px; filter: grayscale(.6); }
  .step.done span { filter: none; opacity: .85; }
  .step.on { color: #fff; } .step.on span { filter: none; width: 46px; height: 46px; margin-top: -4px; background: radial-gradient(#9b5cff, #4a1c9c); box-shadow: 0 0 18px #b36bff; border-color: #e0c0ff; }
  .track hr { width: 26px; border: 0; border-top: 2px solid #8a72b8; margin: 19px 0 0; }
  .pen { position: relative; flex: 1; width: 100%; min-height: 200px; display: flex; justify-content: center; align-items: flex-end; }
  .rune { position: absolute; bottom: 0; left: 50%; width: min(400px, 80%); aspect-ratio: 1; transform: translate(-50%, 38%) scaleY(.32); pointer-events: none; }
  .rune svg { width: 100%; height: 100%; animation: spin 40s linear infinite; filter: drop-shadow(0 0 10px #c77dff) drop-shadow(0 0 24px #8b4dff); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #petbox { position: relative; height: 92%; max-height: 330px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 4%; }
  #pet { height: 100%; transform-origin: 50% 100%; animation: breathe 2.6s ease-in-out infinite; filter: drop-shadow(0 0 18px #a855f788); transition: height .5s; }
  @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-6px) scale(1.015, .985); } }
  .pen.asleep #pet { animation-duration: 5s; filter: brightness(.55) drop-shadow(0 0 10px #6a4bff); }
  .pen.sick #pet { animation-duration: .9s; }
  .pen.dead #pet { opacity: .15; animation: none; }
  .pen.busy #pet { opacity: .35; }
  #bubble { position: absolute; top: 2%; right: -70px; min-width: 52px; padding: 6px 12px; border-radius: 16px; background: #2a1450ee; border: 2px solid #c77dff; box-shadow: 0 0 16px #a855f7; font-size: 15px; font-weight: 800; white-space: nowrap; animation: float 3s ease-in-out infinite; }
  #bubble::after { content: ""; position: absolute; left: 14px; bottom: -9px; border: 8px solid transparent; border-top-color: #c77dff; border-bottom: 0; }
  @keyframes float { 50% { transform: translateY(-5px); } }
  #toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); max-width: 90%; padding: 7px 16px; border-radius: 99px; background: #2a1450ee; border: 1px solid #c77dff; font-weight: 700; font-size: 13px; z-index: 3; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; }
  #toast.on { opacity: 1; }
  .dock { display: flex; gap: 6px; padding: 8px 10px; border-radius: 18px; margin-top: 6px; }
  .act { position: relative; width: 78px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 800; font-size: 14px; }
  .act span { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: radial-gradient(circle at 50% 35%, #5a2c9c, #2a1250); border: 2px solid #8b5cd6; box-shadow: 0 0 12px #8b4dff88, inset 0 2px 0 #ffffff22; }
  .act:not(:disabled):hover span { box-shadow: 0 0 20px #c77dff; }
  .act .dot { top: -2px; right: 8px; }
  .act em { position: absolute; top: 38px; right: 6px; font-style: normal; font-size: 11px; background: #ffcc4d; color: #3a2300; border-radius: 99px; padding: 0 5px; font-weight: 900; }

  .right { grid-area: right; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .card { padding: 12px 16px; }
  .mood { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 4px; }
  .mood .lbl { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 4px; border-radius: 99px; background: #1f6b3a66; color: #6ff59a; font-weight: 900; font-size: 18px; margin: 4px 0 6px; }
  .mood .lbl span { font-size: 26px; }
  .mood p { margin: 0; font-size: 13.5px; }
  .mood img { width: 90px; height: 90px; object-fit: contain; grid-row: span 2; }
  .evo { display: grid; grid-template-columns: 1fr 96px; gap: 6px; align-items: center; }
  .evo small { color: var(--dim); }
  .inf { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 13.5px; margin-top: 6px; }
  .inf b { color: #5ff08f; }
  .gauge { width: 90px; height: 90px; border-radius: 50%; display: grid; place-items: center; text-align: center; background: conic-gradient(#3ee07f calc(var(--p) * 1%), #2a1c40 0); box-shadow: 0 0 16px #8b4dff66; }
  .gauge div { width: 72px; height: 72px; border-radius: 50%; background: #1a0f30; display: grid; place-items: center; align-content: center; font-weight: 900; font-size: 19px; }
  .gauge small { display: block; font-size: 9.5px; color: var(--dim); font-weight: 700; }
  .hab { display: grid; grid-template-columns: 84px 1fr 30px; gap: 4px 12px; align-items: center; }
  .thumb { grid-row: span 2; width: 84px; height: 60px; border-radius: 10px; border: 1px solid var(--line); background: radial-gradient(circle at 70% 25%, #f3e9ff 0 7%, #b98bff55 8% 18%, transparent 19%), linear-gradient(#3a1b6e, #160b2b); }
  .thumb.h1 { filter: hue-rotate(-70deg); } .thumb.h2 { filter: hue-rotate(75deg); }
  .hab b { font-size: 16px; }
  .tags { grid-column: 2 / 4; display: flex; gap: 5px; flex-wrap: wrap; }
  .tags .pill { font-size: 11px; padding: 2px 7px; }

  .menu { grid-area: menu; display: flex; gap: 10px; justify-content: center; align-self: end; }
  .mbtn { position: relative; flex: 0 1 140px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; border-radius: 14px; font-weight: 800; font-size: 14px; background: linear-gradient(#3a1d66ee, #22103fee); border: 1px solid #8b5cd6; box-shadow: 0 0 14px #7b3cff55, inset 0 1px 0 #ffffff22; }
  .mbtn span { font-size: 24px; line-height: 1.1; }
  .evolve { grid-area: evolve; align-self: end; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 16px; border-radius: 16px; background: linear-gradient(#ffe48a, #f5b631 55%, #d98f12); color: #3a2300; border: 2px solid #fff0b8; box-shadow: 0 0 26px #ffb52a99, inset 0 -3px 0 #a8650a; }
  .evolve span { font-size: 30px; } .evolve b { display: block; font-size: 24px; line-height: 1; font-weight: 900; } .evolve small { font-weight: 800; font-size: 12px; }
  .evolve.wait { filter: saturate(.8) brightness(.9); }
  .evolve.release { background: linear-gradient(#ff9aa8, #d0405a); border-color: #ffd0d8; }

  /* ---- sheet (tabs + menus) ---- */
  #sheet { position: absolute; inset: 12px 14px auto; max-height: calc(100% - 24px); z-index: 4; background: rgba(22, 12, 42, .94); display: none; flex-direction: column; padding: 14px 18px; }
  #sheet.on { display: flex; }
  #sheet header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #sheet header h2 { margin: 0; font-size: 22px; }
  #sheet header button { font-size: 22px; width: 36px; height: 36px; border-radius: 50%; background: #2a1748; }
  #sbody { overflow: auto; flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
  .item { position: relative; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #24143ecc; border: 1px solid var(--line); }
  .item.sel { border-color: #d39bff; box-shadow: 0 0 12px #a855f7; }
  .item img { width: 56px; height: 56px; object-fit: contain; }
  .item .big { font-size: 30px; width: 44px; text-align: center; }
  .item div { flex: 1; min-width: 0; } .item p { margin: 2px 0 0; font-size: 12px; color: var(--dim); }
  .btn { padding: 7px 14px; border-radius: 10px; font-weight: 800; background: linear-gradient(#7b3cff, #5420c0); border: 1px solid #b98bff; white-space: nowrap; }
  .btn.gold { background: linear-gradient(#ffe48a, #f0a81c); color: #3a2300; border-color: #fff0b8; }
  .prog { height: 6px; border-radius: 4px; background: #2a1c40; margin-top: 5px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--gold); }
  table { width: 100%; border-collapse: collapse; } td, th { padding: 7px 8px; text-align: left; border-bottom: 1px solid #ffffff12; } tr.you { background: #7b3cff33; }
  td img { width: 30px; height: 30px; object-fit: contain; vertical-align: middle; }
  .note { color: var(--dim); font-size: 12.5px; margin: 0 0 10px; }
  select { font: inherit; padding: 6px; border-radius: 8px; background: #1c1036; color: inherit; border: 1px solid var(--line); }

  /* ---- mini-games ---- */
  #game { position: fixed; inset: 0; background: #120a22f2; display: none; z-index: 30; }
  #game.on { display: block; }
  #ghud { position: absolute; top: 14px; width: 100%; text-align: center; font-weight: 800; font-size: 18px; }
  #ball { position: absolute; width: 64px; height: 64px; margin: -32px; border-radius: 50%; background: #ffcf4a; font-size: 32px; box-shadow: 0 0 20px #ffcf4a; }
  #react { position: absolute; inset: 60px 10% 10%; border-radius: 24px; font-size: 32px; font-weight: 900; display: none; }
  #react.wait { background: #6b1f3a; display: block; } #react.go { background: #1f8a4a; display: block; }

  /* ---- phones: scene + dock first, then everything stacks ---- */
  @media (max-width: 760px) {
    body { overflow: auto; height: auto; min-height: 100%; }
    .nav { flex-wrap: wrap; height: auto; padding: 8px 10px; gap: 6px; }
    .logo { font-size: 19px; margin: 0; flex: 1; }
    .tabs { order: 3; flex-basis: 100%; }
    .tab { padding: 6px 12px; font-size: 13px; }
    .cur { padding: 4px 8px; }
    main { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "stage" "evolve" "menu" "rail" "left" "right" "count"; padding: 10px; }
    .scene { position: absolute; height: 520px; bottom: auto; }
    .pen { min-height: 290px; }
    #petbox { height: 250px; }
    #bubble { right: -40px; }
    .dock { flex-wrap: wrap; justify-content: center; gap: 2px; }
    .act { width: 56px; font-size: 12px; } .act span { width: 48px; height: 48px; font-size: 22px; } .act em { top: 32px; right: 0; }
    .step { width: 50px; font-size: 11.5px; } .track hr { width: 10px; }
    .menu { flex-wrap: wrap; } .mbtn { flex: 1 1 30%; }
    .rail { flex-direction: row; overflow-x: auto; }
    #sheet { position: fixed; inset: 0; border-radius: 0; }
  }
</style>
</head>
<body>
<nav class="nav">
  <div class="logo">🐾 Pet Den</div>
  <div class="tabs">
    <button class="tab on" data-tab="habitat">🏠 Habitat</button>
    <button class="tab" data-tab="pets">🐾 My Pets</button>
    <button class="tab" data-tab="breed">🧬 Breeding</button>
    <button class="tab" data-tab="city">🏙️ City</button>
    <button class="tab" data-tab="board">🏆 Leaderboard</button>
  </div>
  <div class="wallet">
    <span class="cur" title="Gems (premium)">💎 <b id="gems">0</b></span>
    <span class="cur" title="Coins">🪙 <b id="coins">0</b><button data-tab="shop" aria-label="Get coins">+</button></span>
    <button class="icon-btn" id="bell" aria-label="Notifications">🔔<i class="dot" id="belldot"></i></button>
    <button class="icon-btn" id="avatar" title="wallet">?</button>
  </div>
  <div class="glass" id="logbox"></div>
</nav>
<main>
  <div class="scene" id="scene">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0520"/><stop offset=".4" stop-color="#2a1260"/><stop offset=".62" stop-color="#2f1464"/><stop offset="1" stop-color="#0e0718"/></linearGradient>
        <radialGradient id="moonglow"><stop offset=".3" stop-color="#e2d2ff" stop-opacity=".5"/><stop offset="1" stop-color="#8b4dff" stop-opacity="0"/></radialGradient>
        <radialGradient id="fog" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a86bff" stop-opacity=".45"/><stop offset="1" stop-color="#a86bff" stop-opacity="0"/></radialGradient>
        <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#05020c" stop-opacity=".85"/></radialGradient>
        <linearGradient id="cry" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3a0e78"/><stop offset=".6" stop-color="#b35cff"/><stop offset="1" stop-color="#f6dcff"/></linearGradient>
        <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8e0ff" stop-opacity=".25"/><stop offset=".5" stop-color="#7cc0ff" stop-opacity=".75"/><stop offset="1" stop-color="#d0ecff" stop-opacity=".5"/></linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
        <path id="leaf" d="M0 0 Q14 -22 0 -46 Q-14 -22 0 0Z"/>

    <div class="glass card"><h3>Evolution ⓘ</h3><div class="evo"><div><small>Environment Influence</small><div class="inf" id="inf"></div></div><div class="gauge" id="gauge" style="--p:0"><div><span id="ready">0%</span><small>Evolve<br>Readiness</small></div></div></div></div>
    <div class="glass card"><h3>Habitat</h3><div class="hab"><span class="thumb" id="hthumb"></span><b id="hname">Moonlit Grove</b><button class="icon-btn" id="hgear" aria-label="Change habitat" title="Move habitat">⚙️</button><div class="tags" id="htags"></div></div></div>

  <div class="menu">

    <button class="mbtn" data-tab="quests"><span>📜</span>Quests<i class="dot"></i></button>
    <button class="mbtn" data-tab="games"><span>🕹️</span>Mini Games<i class="dot"></i></button>
    <button class="mbtn" data-tab="ach"><span>🏅</span>Achievements<i class="dot"></i></button>

  <div id="toast"></div>
  <div class="glass" id="sheet"><header><h2 id="stitle"></h2><button id="sclose" aria-label="Close">×</button></header><div id="sbody"></div></div>
</main>
