[package]
name = "pet-den"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "pet_den"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "0.18", features = ["anchor", "access-control"] }

# Standalone crate: keep it out of the repo root workspace.
[workspace]
