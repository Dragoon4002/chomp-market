[package]
name = "sealed-house"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Standalone: not part of the repo root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "sealed_house"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "0.18", features = ["anchor", "vrf"] }
solana-sha256-hasher = "3.1"
