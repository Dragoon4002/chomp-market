[package]
name = "chomp"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Standalone: not part of the repo root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "chomp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }

[profile.release]
overflow-checks = true
